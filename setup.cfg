[metadata]
name = ndc
version = 0.3.0
description = Nonstop Development Crew: budget-aware continuous development by agents
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/albertferreira2020/ndc

[options]
packages = ndc
python_requires = >=3.9
include_package_data = True

[options.entry_points]
console_scripts =
    ndc = ndc.cli:main
